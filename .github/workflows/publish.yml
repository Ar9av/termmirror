name: Publish

# Publishes to npm via trusted publishing (OIDC) — no long-lived token. npm restricts
# 2FA-bypass tokens from publishing directly in January 2027, so releases go through here.
#
# One-time setup on npmjs.com: package settings → Trusted Publisher → GitHub Actions,
# with repository Ar9av/termmirror and workflow publish.yml.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm 11.5.1+ is required for trusted publishing.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      - run: npm publish --access public
